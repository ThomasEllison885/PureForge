<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReConquest of the New World</title>
<style>
:root {
  --ink: #1c140c;
  --paper: #f3ead7;
  --paper-2: #e7dcc4;
  --sea: #07141d;
  --line: #c8b89a;
  --gold: #8c6a2f;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body, #app {
  margin: 0;
  height: 100%;
  background: var(--sea);
  color: var(--paper);
  font-family: "Palatino Linotype", Palatino, Georgia, serif;
}

button, input, select {
  font-family: inherit;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 10px;
}

button { cursor: pointer; }
button:hover { background: #fff8ea; }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: #8c6a2f; color: #fff8ea; border-color: #6d5122; }
button.ghost { background: transparent; color: var(--paper); border-color: #3d5160; }

#battle {
  max-width: 920px;
  margin: 0 auto;
  padding: 32px 20px 48px;
}
#setup {
  max-width: none;
  margin: 0;
  min-height: 100%;
  padding: 28px 16px 72px;
  background: transparent;
}
#title-coast {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}
#setup .title-sheet {
  position: relative;
  z-index: 1;
  width: min(760px, calc(100% - 8px));
  max-width: 100%;
  max-height: none;
  overflow: visible;
  margin: 18px auto 12px;
}
#setup .mast { line-height: 1.15; font-size: clamp(1.7rem, 5vw, 2.35rem); }
#setup .build {
  position: fixed;
  left: 14px;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  z-index: 2;
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: #f3ead7;
  background: rgba(7, 20, 29, 0.62);
  padding: 2px 7px 3px;
  border-radius: 3px;
}
#setup h2 {
  font-size: 1.05rem;
  font-variant: small-caps;
  letter-spacing: 0.06em;
  border-bottom: 1px solid #1c140c;
  margin: 18px 0 8px;
  font-weight: 500;
}
#setup .sub { color: #5c5144; margin: 4px 0 0; }
#setup .choice { background: transparent; color: var(--ink); border-color: #c8b89a; }
#setup .choice.on { background: #1c140c; color: #f6f1e4; border-color: #1c140c; }
#setup .flag {
  width: 9px; height: 9px; border-radius: 50%; display: inline-block;
  margin-right: 6px; border: 1px solid rgba(0,0,0,0.35); vertical-align: 1px;
}
#setup .choice.on .flag { border-color: rgba(255,255,255,0.5); }
#setup .skill { background: #f7f0e0; color: var(--ink); border-color: #c8b89a; }
#setup .skill.on { border-color: #8c6a2f; background: #efe3c8; }
#setup .skill small { color: #5c5144; }
#setup button.ghost, #setup label.ghost {
  background: transparent; color: var(--ink); border-color: #c8b89a;
}
#setup label.ghost {
  display: inline-flex; align-items: center; border: 1px solid #c8b89a;
  border-radius: 4px; cursor: pointer;
}
#setup input { background: #fffaf0; color: var(--ink); }

h1 { font-weight: 500; font-size: 2.4rem; margin: 0 0 4px; }
.sub { color: #d5c7ae; margin: 0 0 24px; }

.row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
.choice {
  background: transparent;
  color: var(--paper);
  border-color: #3d5160;
  min-width: 7rem;
}
.choice.on { background: var(--paper); color: var(--ink); border-color: var(--paper); }

.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.skill {
  text-align: left;
  background: #10202b;
  color: var(--paper);
  border-color: #3d5160;
  padding: 8px 10px;
}
.skill.on { border-color: #e2c57a; background: #1a3142; }
.skill small { display: block; color: #b7c3cc; font-family: "Source Sans 3", "Segoe UI", sans-serif; }

#game {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100%;
}
header.bar, footer.bar {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 8px 12px;
  background: #0c1c27;
  border-bottom: 1px solid #1e3342;
}
footer.bar { border-bottom: 0; border-top: 1px solid #1e3342; height: 92px; align-items: stretch; }
#log {
  flex: 1;
  overflow: auto;
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1.4;
  color: #d5deE4;
}
.layout { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
#map { width: 100%; height: 100%; display: block; cursor: grab; }
#map.drag { cursor: grabbing; }
aside {
  background: var(--paper);
  color: var(--ink);
  overflow: auto;
  padding: 12px 14px 20px;
  border-left: 1px solid #1e3342;
}
aside h2 { font-size: 1.15rem; margin: 12px 0 6px; }
aside p, aside li { font-family: "Segoe UI", sans-serif; font-size: 14px; line-height: 1.4; }
.build-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.build-list button { text-align: left; }
.build-list small { display: block; color: #5c5144; font-family: "Segoe UI", sans-serif; font-size: 12px; }
.build-list button.on { background: #1c140c; color: #f6f1e4; }
.build-list button.on small { color: #d5c7ae; }
aside .muted { color: #5c5144; }
label.keep { display: flex; align-items: center; gap: 6px; font-family: "Segoe UI", sans-serif; font-size: 14px; }
label.keep input { width: 16px; height: 16px; margin: 0; }
.card.find h2 { margin: 2px 0 8px; }
.find-kicker { margin: 0; color: #6b5a3a; font-family: "Segoe UI", sans-serif; font-size: 13px; }
ul.finds { list-style: none; padding: 0; margin: 4px 0 8px; }
ul.finds li { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.4); display: inline-block; }
button.find-link { display: flex; align-items: center; gap: 8px; background: transparent; border: 0; padding: 2px 0; color: inherit; text-align: left; }
button.find-link:hover { text-decoration: underline; background: transparent; }
.side-sub { font-size: 1rem; margin: 12px 0 4px; }
aside select { width: 100%; }
table.stock { width: 100%; border-collapse: collapse; font-family: "Segoe UI", sans-serif; font-size: 14px; margin: 6px 0 10px; }
table.stock th { font-weight: 600; color: #5c5144; font-size: 12px; text-align: left; }
table.stock td, table.stock th { padding: 2px 4px; border-bottom: 1px solid #e0d4bc; }
table.stock .num { text-align: right; font-variant-numeric: tabular-nums; }
table.stock .up { color: #2f6b3a; }
table.stock .down { color: #a02c22; }
.people { font-family: "Segoe UI", sans-serif; font-size: 14px; margin: 2px 0 4px; }
.auto { border: 1px solid #d6c8aa; border-radius: 6px; padding: 8px; margin: 8px 0; }
.auto.on { border-color: #8c6a2f; background: #efe3c8; }
.auto .goals { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
.auto .goal { color: var(--ink); border-color: #c8b89a; min-width: 0; font-size: 13px; padding: 4px 8px; }
.auto .goal.on { background: #1c140c; color: #f6f1e4; }
.build-list button.short { opacity: 0.55; }
button small { display: block; font-family: "Segoe UI", sans-serif; font-size: 12px; color: inherit; opacity: 0.8; }
ul.underway { margin: 4px 0 8px; padding-left: 18px; font-family: "Segoe UI", sans-serif; font-size: 13px; }
.pick { border-top: 1px solid #d6c8aa; margin-top: 8px; }
ul.mods { margin: 4px 0 8px; padding-left: 18px; }
ul.mods li { margin: 1px 0; }
button.recruit { display: block; width: 100%; margin: 4px 0; text-align: left; }
button.recruit small { display: block; font-weight: 400; }
.transfer { display: grid; grid-template-columns: 1fr 1fr 70px auto; gap: 4px; }
.transfer input { width: 100%; }
ul.colony-list { padding-left: 0; list-style: none; }
ul.colony-list li { margin: 6px 0; font-family: "Segoe UI", sans-serif; font-size: 14px; }
ul.colony-list small { color: #5c5144; }
.place-tip { position: fixed; z-index: 50; pointer-events: none; background: rgba(24, 18, 12, 0.92); color: #f4ead2; border: 1px solid #c8a656; border-radius: 4px; padding: 4px 8px; font: 13px "Segoe UI", sans-serif; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
.place-tip .ok { color: #cfe8a8; }
.place-tip .no { color: #f0a898; }
.place-tip[hidden] { display: none; }
button.danger { background: #7a2e24; color: #fff4e8; border-color: #5a1e18; }
#status { min-height: 1.2em; color: #7a2e24; font-family: "Segoe UI", sans-serif; font-size: 14px; }
.minimap-wrap { margin-top: 8px; }
#minimap { width: 100%; height: auto; aspect-ratio: 4 / 3; cursor: pointer; background: #07141d; border-radius: 4px; }

#modal {
  position: fixed;
  inset: 0;
  background: rgba(4, 10, 14, 0.62);
  display: flex;
  align-items: center;
  justify-content: center;
}
#modal[hidden], #setup[hidden], #game[hidden], #battle[hidden], #colony[hidden] { display: none; }

#colony {
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  height: 100%;
  background: var(--sea);
  color: var(--paper);
}
.tool-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 12px;
  background: #0c1c27;
  border-bottom: 1px solid #1e3342;
}
.tool-row .choice { min-width: 0; }
.tool-row small { display: block; color: #b7c3cc; font-family: "Segoe UI", sans-serif; }
.tool-row .choice.on small { color: #5c5144; }
#colony-board { overflow: auto; padding: 16px; }
#plot { display: block; background: #07141d; cursor: crosshair; }
#colony footer.bar { height: auto; min-height: 48px; align-items: center; }
#colony-note {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  font-size: 14px;
}
.card {
  background: var(--paper);
  color: var(--ink);
  padding: 18px 18px 14px;
  width: min(420px, calc(100% - 32px));
  border-radius: 6px;
}
.card input { width: 100%; margin: 8px 0 12px; }

.sheet {
  background: #f4e6c8;
  color: var(--ink);
  width: min(880px, calc(100% - 28px));
  max-height: calc(100% - 28px);
  overflow: auto;
  padding: 26px 32px 18px;
  border: 1px solid #c4b48a;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
}
.sheet .kicker, .sheet .dateline {
  text-align: center;
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  font-size: 13px;
  letter-spacing: 0.04em;
}
.sheet .mast {
  text-align: center;
  font-weight: 500;
  font-size: 2.1rem;
  margin: 4px 0 8px;
  padding-bottom: 8px;
  border-bottom: 3px double #1c140c;
}
.sheet .dateline { margin: 8px 0 4px; }
.sheet .columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 28px;
  margin-top: 14px;
}
.sheet .standings { grid-column: 1 / -1; }
.sheet h3 {
  font-size: 1.05rem;
  font-variant: small-caps;
  letter-spacing: 0.06em;
  border-bottom: 1px solid #1c140c;
  margin: 8px 0 6px;
}
.sheet p {
  font-size: 15.5px;
  line-height: 1.45;
  margin: 0 0 8px;
}
.sheet-close { justify-content: center; margin-top: 8px; }

.grid3 {
  display: grid;
  grid-template-columns: repeat(3, 72px);
  gap: 6px;
  margin: 12px 0;
}
.cell {
  height: 64px;
  background: #1a3142;
  color: var(--paper);
  border-color: #3d5160;
  font-size: 12px;
}
.dice { font-family: "Segoe UI", sans-serif; font-size: 13px; color: #d5deE4; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  aside { max-height: 42vh; }
  .skills { grid-template-columns: 1fr; }
  .sheet .columns { grid-template-columns: 1fr; }
  .sheet { padding: 18px 16px 12px; }
  #setup { padding-top: 8px; }
  #setup .title-sheet { margin-top: 112px; }
}

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); height: 100%; }
</style>
