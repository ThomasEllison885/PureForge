<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReConquest of the New World</title>
<style>
:root {
  --ink: #1c140c;
  --paper: #f3ead7;
  --paper-2: #e7dcc4;
  --sea: #07141d;
  --line: #c8b89a;
  --gold: #8c6a2f;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body, #app {
  margin: 0;
  height: 100%;
  background: var(--sea);
  color: var(--paper);
  font-family: "Palatino Linotype", Palatino, Georgia, serif;
}

button, input, select {
  font-family: inherit;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 10px;
}

button { cursor: pointer; }
button:hover { background: #fff8ea; }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: #8c6a2f; color: #fff8ea; border-color: #6d5122; }
button.ghost { background: transparent; color: var(--paper); border-color: #3d5160; }
#next-unit.pending { position: relative; background: #2f6b5a; color: #fff8ea; border-color: #7fd0b4; }
/* The pulse is a ring scaled and faded on its own layer, so the page is not repainted each frame. */
#next-unit.pending::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; border: 2px solid rgba(127, 208, 180, 0.7); pointer-events: none; will-change: transform, opacity; animation: nextPulse 1.8s ease-out infinite; }
@keyframes nextPulse { 0% { transform: scale(1); opacity: 0.9; } 70% { transform: scale(1.12, 1.35); opacity: 0; } 100% { transform: scale(1.12, 1.35); opacity: 0; } }
#next-unit.wait { position: relative; background: #8a5a1c; color: #fff8ea; border-color: #e8b860; }
#next-unit.wait::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; border: 2px solid rgba(232, 184, 96, 0.75); pointer-events: none; will-change: transform, opacity; animation: nextPulse 1.8s ease-out infinite; }
#next-unit.play { opacity: 0.7; font-style: italic; }
#next-unit.done { color: #9fb3a8; border-color: #3d5160; }
#end.ready { box-shadow: 0 0 0 2px #e8b860, 0 0 10px rgba(232, 184, 96, 0.6); }
@media (prefers-reduced-motion: reduce) { #next-unit.pending::after, #next-unit.wait::after { animation: none; } }

#battle {
  max-width: 1280px;
  margin: 0 auto;
  padding: 14px 20px 24px;
}
#battle h1 { font-size: 30px; margin: 0 0 2px; }
#battle .sub { margin: 0 0 6px; }
#battle .row.btop { margin: 4px 0 6px; }
#setup {
  max-width: none;
  margin: 0;
  min-height: 100%;
  padding: 28px 16px 72px;
  background: transparent;
}
#title-coast {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}
#setup .title-sheet {
  position: relative;
  z-index: 1;
  width: min(760px, calc(100% - 8px));
  max-width: 100%;
  max-height: none;
  overflow: visible;
  margin: 18px auto 12px;
}
#setup .mast { line-height: 1.15; font-size: clamp(1.7rem, 5vw, 2.35rem); }
#setup .build {
  position: fixed;
  left: 14px;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  z-index: 2;
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: #f3ead7;
  background: rgba(7, 20, 29, 0.62);
  padding: 2px 7px 3px;
  border-radius: 3px;
}
#setup h2 {
  font-size: 1.05rem;
  font-variant: small-caps;
  letter-spacing: 0.06em;
  border-bottom: 1px solid #1c140c;
  margin: 18px 0 8px;
  font-weight: 500;
}
#setup .sub { color: #5c5144; margin: 4px 0 0; }
#setup .choice { background: transparent; color: var(--ink); border-color: #c8b89a; }
#setup .choice.on { background: #1c140c; color: #f6f1e4; border-color: #1c140c; }
#setup .flag {
  width: 9px; height: 9px; border-radius: 50%; display: inline-block;
  margin-right: 6px; border: 1px solid rgba(0,0,0,0.35); vertical-align: 1px;
}
#setup .choice.on .flag { border-color: rgba(255,255,255,0.5); }
#setup .skill { background: #f7f0e0; color: var(--ink); border-color: #c8b89a; }
#setup .skill.on { border-color: #8c6a2f; background: #efe3c8; }
#setup .skill small { color: #5c5144; }
#setup .focus-list { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 4px; }
#setup .focus-row {
  display: grid;
  grid-template-columns: 32px 2.4rem 32px 1fr;
  gap: 6px;
  align-items: center;
  background: #f7f0e0;
  border: 1px solid #c8b89a;
  border-radius: 4px;
  padding: 6px 8px;
  color: var(--ink);
}
#setup .focus-row b { text-align: center; font-weight: 600; }
#setup .focus-row small { display: block; color: #5c5144; font-family: "Source Sans 3", "Segoe UI", sans-serif; font-weight: 400; }
#setup .focus-row button { padding: 2px 0; min-width: 0; }
#setup button.ghost, #setup label.ghost {
  background: transparent; color: var(--ink); border-color: #c8b89a;
}
#setup label.ghost {
  display: inline-flex; align-items: center; border: 1px solid #c8b89a;
  border-radius: 4px; cursor: pointer;
}
#setup input { background: #fffaf0; color: var(--ink); }

h1 { font-weight: 500; font-size: 2.4rem; margin: 0 0 4px; }
.sub { color: #d5c7ae; margin: 0 0 24px; }

.row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
.choice {
  background: transparent;
  color: var(--paper);
  border-color: #3d5160;
  min-width: 7rem;
}
.choice.on { background: var(--paper); color: var(--ink); border-color: var(--paper); }

.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.skill {
  text-align: left;
  background: #10202b;
  color: var(--paper);
  border-color: #3d5160;
  padding: 8px 10px;
}
.skill.on { border-color: #e2c57a; background: #1a3142; }
.skill small { display: block; color: #b7c3cc; font-family: "Source Sans 3", "Segoe UI", sans-serif; }

#game {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100%;
}
header.bar, footer.bar {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 8px 12px;
  background: #0c1c27;
  border-bottom: 1px solid #1e3342;
}
footer.bar { border-bottom: 0; border-top: 1px solid #1e3342; height: 92px; align-items: stretch; }
#log {
  flex: 1;
  overflow: auto;
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1.4;
  color: #d5deE4;
  white-space: pre-wrap;
  min-width: 0;
}
.layout { position: relative; z-index: 0; min-height: 0; overflow: hidden; }
/* The map fills the window; what you click on opens as a card over it. */
.layout aside#side { position: absolute; top: 10px; right: 10px; width: 340px; max-height: calc(100% - 230px); min-height: 0; border: 1px solid #b9a67e; border-radius: 8px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45); z-index: 6; padding-top: 10px; }
.layout aside#side.closed { display: none; }
.layout aside#side.colony { max-height: calc(100% - 20px); right: 240px; }
.troops .tcols { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.troops .tcol { flex: 1 1 130px; min-width: 120px; border: 1px solid #b9a67e; border-radius: 6px; background: rgba(140, 106, 47, 0.08); padding: 5px 6px; display: flex; flex-direction: column; gap: 4px; }
.troops .tcol.target { border-style: dashed; cursor: pointer; }
.troops .tcol.over { background: rgba(140, 106, 47, 0.22); border-color: #8c6a2f; }
.troops .thead { display: flex; flex-direction: column; line-height: 1.2; }
.troops .thead small, .troops .tfoot { font-size: 0.8em; color: #6b5a3a; }
.troops .tlist { display: flex; flex-wrap: wrap; gap: 3px; min-height: 24px; }
.troops .tchip { font-size: 0.82em; padding: 2px 6px; border-radius: 4px; cursor: grab; }
.troops .tchip.on { outline: 2px solid #8c6a2f; background: #f3e4bf; }
.troops .tfoot { display: flex; flex-direction: column; gap: 4px; margin-top: auto; }
.troops .tlist .muted { font-size: 0.82em; }
.troops .tdef { color: #7a5a10; font-weight: 600; }
.town-leaders { margin: 8px 0; padding: 6px 8px; border: 1px solid #b9a67e; border-radius: 6px; background: rgba(140, 106, 47, 0.08); }
.town-leaders .row { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
.town-leaders .row .muted { flex: 1; }
.brules summary { cursor: pointer; color: #9fb3a8; font-size: 13px; margin-top: 8px; }
.brules[open] summary { margin-bottom: 4px; }
.card-x { position: sticky; top: 0; float: right; margin: -4px -6px 0 8px; width: 26px; height: 26px; padding: 0; border-radius: 50%; font-size: 16px; line-height: 24px; background: #efe4cc; color: #4a3a22; border: 1px solid #b9a67e; z-index: 1; }
#mini { position: absolute; right: 10px; bottom: 10px; width: 220px; z-index: 5; border: 1px solid #3d5160; border-radius: 6px; overflow: hidden; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45); background: #07141d; }
#mini canvas { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; cursor: pointer; }
#maptip { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 260px); z-index: 4; padding: 5px 10px; border-radius: 5px; background: rgba(12, 22, 30, 0.82); color: #e8eef2; font: 13px "Segoe UI", sans-serif; pointer-events: none; }
#maptip:empty { display: none; }
#zoombar { position: absolute; right: 10px; bottom: 182px; z-index: 5; display: flex; flex-direction: column; gap: 4px; }
#zoombar button { width: 34px; height: 34px; padding: 0; font: 700 20px/1 "Segoe UI", sans-serif; border-radius: 6px; background: rgba(250,244,230,0.95); color: #3a2a18; border: 1px solid #b9a67e; box-shadow: 0 3px 10px rgba(0,0,0,0.35); }
.frame-meter { position: absolute; left: 10px; top: 10px; z-index: 8; padding: 4px 8px; border-radius: 4px; background: rgba(0,0,0,0.7); color: #9fe8b0; font: 12px ui-monospace, Menlo, monospace; }
#toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: min(560px, calc(100% - 400px)); z-index: 7; padding: 8px 14px; border-radius: 6px; background: rgba(250, 244, 230, 0.96); color: #4a2a14; border: 1px solid #b9a67e; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); font: 14px "Segoe UI", sans-serif; }
#map { width: 100%; height: 100%; display: block; cursor: grab; }
#map.drag { cursor: grabbing; }
aside {
  background: var(--paper);
  color: var(--ink);
  overflow: auto;
  padding: 12px 14px 20px;
  border-left: 1px solid #1e3342;
}
aside h2 { font-size: 1.15rem; margin: 12px 0 6px; }
aside p, aside li { font-family: "Segoe UI", sans-serif; font-size: 14px; line-height: 1.4; }
.build-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.build-list button { text-align: left; }
.build-list small { display: block; color: #5c5144; font-family: "Segoe UI", sans-serif; font-size: 12px; }
.build-list button.on { background: #1c140c; color: #f6f1e4; }
.build-list button.on small { color: #d5c7ae; }
aside .muted { color: #5c5144; }
label.keep { display: flex; align-items: center; gap: 6px; font-family: "Segoe UI", sans-serif; font-size: 14px; }
label.keep input { width: 16px; height: 16px; margin: 0; }
.card.find h2 { margin: 2px 0 8px; }
.find-kicker { margin: 0; color: #6b5a3a; font-family: "Segoe UI", sans-serif; font-size: 13px; }
ul.finds { list-style: none; padding: 0; margin: 4px 0 8px; }
ul.finds li { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.4); display: inline-block; }
button.find-link { display: flex; align-items: center; gap: 8px; background: transparent; border: 0; padding: 2px 0; color: inherit; text-align: left; }
button.find-link:hover { text-decoration: underline; background: transparent; }
.side-sub { font-size: 1rem; margin: 12px 0 4px; }
aside select { width: 100%; }
table.stock { width: 100%; border-collapse: collapse; font-family: "Segoe UI", sans-serif; font-size: 14px; margin: 6px 0 10px; }
table.stock th { font-weight: 600; color: #5c5144; font-size: 12px; text-align: left; }
table.stock td, table.stock th { padding: 2px 4px; border-bottom: 1px solid #e0d4bc; }
table.stock .num { text-align: right; font-variant-numeric: tabular-nums; }
table.stock .up { color: #2f6b3a; }
table.stock .down { color: #a02c22; }
.people { font-family: "Segoe UI", sans-serif; font-size: 14px; margin: 2px 0 4px; }
.auto { border: 1px solid #d6c8aa; border-radius: 6px; padding: 8px; margin: 8px 0; }
.auto.on { border-color: #8c6a2f; background: #efe3c8; }
.auto .goals { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
.auto .goal { color: var(--ink); border-color: #c8b89a; min-width: 0; font-size: 13px; padding: 4px 8px; }
.auto .goal.on { background: #1c140c; color: #f6f1e4; }
.build-list button.short { opacity: 0.55; }
button small { display: block; font-family: "Segoe UI", sans-serif; font-size: 12px; color: inherit; opacity: 0.8; }
ul.underway { margin: 4px 0 8px; padding-left: 18px; font-family: "Segoe UI", sans-serif; font-size: 13px; }
.pick { border-top: 1px solid #d6c8aa; margin-top: 8px; }
ul.mods { margin: 4px 0 8px; padding-left: 18px; }
ul.mods li { margin: 1px 0; }
button.recruit { display: block; width: 100%; margin: 4px 0; text-align: left; }
button.recruit small { display: block; font-weight: 400; }
.transfer { display: grid; grid-template-columns: 1fr 1fr 70px auto; gap: 4px; }
.transfer input { width: 100%; }
ul.colony-list { padding-left: 0; list-style: none; }
ul.colony-list li { margin: 6px 0; font-family: "Segoe UI", sans-serif; font-size: 14px; }
ul.colony-list small { color: #5c5144; }
/* Battle board */
.bwrap { display: grid; grid-template-columns: minmax(360px, 1fr) minmax(220px, 300px); gap: 22px; align-items: start; }
@media (max-width: 820px) { .bwrap { grid-template-columns: 1fr; } }
.bboard { padding: 10px; border-radius: 10px; margin: 8px 0; background: radial-gradient(ellipse at 30% 20%, rgba(150,170,90,0.35), transparent 60%), radial-gradient(ellipse at 80% 85%, rgba(60,80,30,0.5), transparent 55%), repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0 3px, transparent 3px 9px), linear-gradient(#5d7a3a, #48632c); box-shadow: inset 0 0 30px rgba(0,0,0,0.45), 0 3px 10px rgba(0,0,0,0.4); border: 3px solid #6b5432; }
.bgrid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 96px; gap: 5px; }
#intro { position: fixed; inset: 0; z-index: 1000; background: #0b1420; cursor: pointer; transition: opacity 0.42s ease; }
#intro.out { opacity: 0; pointer-events: none; }
#intro canvas.iscene { position: absolute; inset: 0; width: 100%; height: 100%; }
#intro .iload { position: absolute; right: 28px; bottom: 24px; display: flex; align-items: center; gap: 10px; color: #f4ead2; font: 600 16px Palatino, Georgia, serif; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
#intro .iskip { position: absolute; left: 24px; bottom: 18px; margin: 0; color: rgba(244,234,210,0.6); font: 13px "Segoe UI", sans-serif; }
.trades-card { width: min(640px, calc(100vw - 32px)); max-width: none; max-height: calc(100vh - 60px); overflow-y: auto; }
.trade-row { border-top: 1px solid #d8c9a6; padding: 8px 0 4px; }
.trade-row > p { margin: 2px 0; }
.trade-picks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.trade-picks select { max-width: 100%; }
.trade-row .advice { margin: 6px 0 2px; padding: 5px 10px; }
.trade-row .advice b { font-size: 14px; }
.advice { margin: 10px 0 4px; padding: 8px 12px; border-radius: 6px; border-left: 5px solid #b9a67e; background: rgba(0,0,0,0.04); font: 14px "Segoe UI", sans-serif; }
.advice b { font: 700 16px Palatino, Georgia, serif; }
.advice ul { margin: 4px 0 0; padding-left: 18px; }
.advice.good { border-left-color: #3a8a4a; background: rgba(58,138,74,0.1); }
.advice.good b { color: #2a6a38; }
.advice.poor { border-left-color: #b0442e; background: rgba(176,68,46,0.08); }
.advice.poor b { color: #9a2a20; }
.announce-card { display: flex; gap: 16px; align-items: flex-start; max-width: 560px; }
.announce-card .ann-art { flex: none; width: 120px; height: 90px; border-radius: 6px; background: linear-gradient(#cfe0c0, #9ab878); border: 1px solid #b9a67e; }
.announce-card.raid .ann-art { background: linear-gradient(#e8c8a0, #b88a5a); }
.outcome { position: fixed; inset: 0; z-index: 1100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8, 6, 4, 0.28); cursor: pointer; animation: obFade 0.3s ease; transition: opacity 0.5s ease; }
.outcome.out { opacity: 0; pointer-events: none; }
/* After a battle: a card in the middle of the field with the way back. */
.bover { position: fixed; inset: 0; z-index: 1050; display: flex; align-items: center; justify-content: center; background: rgba(8, 6, 4, 0.35); animation: boverIn 0.4s ease 1.4s both; }
.bover .card { max-width: 420px; text-align: center; }
.bover .card button { font-size: 17px; padding: 10px 22px; }
@keyframes boverIn { from { opacity: 0; } to { opacity: 1; } }
.outcome .ob-band { position: absolute; left: -10%; width: 120%; top: 50%; height: 190px; margin-top: -105px; transform: rotate(-3deg); transform-origin: left center; clip-path: polygon(0 12%, 6% 4%, 14% 10%, 25% 2%, 38% 9%, 52% 0, 63% 8%, 77% 3%, 88% 10%, 100% 5%, 100% 92%, 90% 98%, 78% 90%, 64% 99%, 50% 91%, 37% 100%, 24% 92%, 12% 99%, 0 90%); animation: obWipe 0.45s cubic-bezier(.2,.7,.2,1) both; }
.outcome.win .ob-band { background: linear-gradient(180deg, rgba(40, 26, 10, 0.94), rgba(20, 12, 4, 0.94)); box-shadow: 0 0 60px rgba(230, 180, 80, 0.25); }
.outcome.lose .ob-band { background: linear-gradient(180deg, rgba(110, 18, 12, 0.94), rgba(50, 6, 4, 0.94)); }
.outcome .ob-text { position: relative; font: 700 clamp(64px, 12vw, 150px)/1 Palatino, Georgia, serif; letter-spacing: 0.08em; text-transform: uppercase; transform: rotate(-3deg); animation: obSlam 0.55s cubic-bezier(.2,.8,.2,1) 0.12s both; }
.outcome.win .ob-text { background: linear-gradient(180deg, #fff3c4 0%, #f0c04a 45%, #a8741e 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 2px rgba(60, 36, 8, 0.7); filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6)); }
.outcome.lose .ob-text { color: #e8ddd0; -webkit-text-stroke: 2px rgba(60, 8, 4, 0.8); filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7)); }
.card.end-card { width: min(780px, calc(100vw - 32px)); max-width: none; }
.end-table { overflow-x: auto; }
.end-table table { font-size: 13px; }
.outcome.loot .ob-band { background: linear-gradient(180deg, rgba(58, 40, 8, 0.95), rgba(30, 20, 2, 0.95)); box-shadow: 0 0 70px rgba(255, 200, 60, 0.35); }
.outcome.loot .ob-text { background: linear-gradient(180deg, #fffbe0 0%, #ffd84a 40%, #c88a10 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 2px rgba(70, 40, 0, 0.75); filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.6)); }
.outcome.raided .ob-band { background: linear-gradient(180deg, rgba(120, 66, 14, 0.94), rgba(60, 30, 6, 0.94)); }
.outcome.raided .ob-text { color: #f6e2c0; -webkit-text-stroke: 2px rgba(70, 30, 4, 0.8); filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7)); }
.outcome .ob-coins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.outcome .ob-coins i { position: absolute; top: -30px; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c0, #f0c040 45%, #9a6a10); box-shadow: 0 0 0 2px rgba(90, 56, 6, 0.6); animation: obCoin 1.6s cubic-bezier(.4,0,.8,.6) both; }
.outcome.raided .ob-coins i { animation-name: obCoinUp; top: auto; bottom: 30%; }
@keyframes obCoin { from { transform: translateY(0) rotateY(0); opacity: 1; } to { transform: translateY(70vh) rotateY(720deg); opacity: 0.9; } }
@keyframes obCoinUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-40vh) translateX(30vw); opacity: 0; } }
.bsum .find-kicker { font-weight: 700; letter-spacing: 0.12em; }
.bsum.win .find-kicker, .bsum.loot .find-kicker { color: #a8741e; }
.bsum.lose .find-kicker { color: #a0281c; }
.bsum.raided .find-kicker { color: #9a5a14; }
.bsum-t { width: 100%; border-collapse: collapse; margin: 6px 0 10px; font-size: 14px; }
.bsum-t td { padding: 4px 6px; border-bottom: 1px solid rgba(80, 60, 30, 0.15); }
